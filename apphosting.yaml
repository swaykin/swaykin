# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAQx4hgHmTbPgc-oOlWX3Kvu29D4gL5O54
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: swaykin-ai.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: swaykin-ai
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FUNCTIONS_BASE_URL
    value: https://api.swaykin.com/v1
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLOUD_FUNCTIONS_BASE_URL
    value: https://asia-south1-swaykin-ai.cloudfunctions.net
    availability:
      - BUILD
      - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
